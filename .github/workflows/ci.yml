name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          version: latest

      - name: Format check
        run: zig fmt --check .

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all
