name: Release

# Releases build only when a tag is pushed to the repo. Tags are date-time
# stamps in fossil's snapshot format — YYYYMMDDHHMM or YYYYMMDDHHMMSS (UTC),
# e.g. 20260801193352. The tag itself is the version in the artifact names.
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'

permissions:
  contents: write

jobs:
  build:
    name: release (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-linux-gnu
          - platform: mac-arm
            target: aarch64-macos
          - platform: mac-x64
            target: x86_64-macos
          - platform: pi
            target: aarch64-linux-gnu
          - platform: w32
            target: x86-windows-gnu
          - platform: w64
            target: x86_64-windows-gnu
          - platform: win-arm
            target: aarch64-windows-gnu
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - name: Test
        run: zig build test --summary all

      - name: Build (${{ matrix.platform }})
        run: zig build --release=small -Dtarget=${{ matrix.target }}

      - name: Package (acps-<platform>-<stamp>)
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          EXE=""
          case "${{ matrix.platform }}" in
            w32|w64|win-arm) EXE=".exe"; ARCHIVE="acps-${{ matrix.platform }}-${VER}.zip" ;;
            *)               ARCHIVE="acps-${{ matrix.platform }}-${VER}.tar.gz" ;;
          esac
          if [[ "$ARCHIVE" == *.zip ]]; then
            (cd zig-out/bin && zip -q "$GITHUB_WORKSPACE/$ARCHIVE" "acps${EXE}")
          else
            tar -czf "$ARCHIVE" -C zig-out/bin "acps${EXE}"
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: acps-${{ matrix.platform }}
          path: acps-${{ matrix.platform }}-*

  src:
    name: release (src)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package source tarball (acps-src-<stamp>)
        run: |
          VER="${{ github.ref_name }}"
          git archive --format=tar.gz -o "acps-src-${VER}.tar.gz" HEAD
          echo "archive=acps-src-${VER}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: acps-src
          path: acps-src-*

  release:
    name: publish release
    needs: [build, src]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
